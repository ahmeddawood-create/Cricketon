{% extends "base.html" %}

{% block title %}Player Directory & Stats - Cricketon{% endblock %}

{% block content %}
<div x-data="playerDirectory()" x-init="init()" class="space-y-6 max-w-3xl mx-auto">
  
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase tracking-wider">
        Community Directory
      </span>
      <h1 class="text-2xl font-black text-white mt-1">Player Career Records</h1>
      <p class="text-xs text-slate-400">Aggregated match stats, batting totals, boundaries, and bowling economy</p>
    </div>

    <!-- Search and Actions -->
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <div class="w-full sm:w-56">
        <input type="text" x-model="search" placeholder="Search player name..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none">
      </div>
      <button type="button" @click="cleanupUnused()"
        class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white text-xs font-semibold whitespace-nowrap"
        title="Remove players who have never played any match">
        🧹 Clean Inactive
      </button>
    </div>
  </div>

  <!-- Player Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <template x-for="p in filteredPlayers" :key="p.id">
      <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 transition-all shadow-sm flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-white text-base flex items-center gap-1.5">
              <span>🏏</span>
              <span x-text="p.name"></span>
            </h3>
            <span class="text-[11px] font-semibold text-slate-400" x-text="p.stats ? p.stats.matches_played + ' matches' : ''"></span>
          </div>

          <!-- Batting Summary -->
          <div class="mt-3 bg-slate-950/70 rounded-lg p-3 border border-slate-800/80 space-y-1">
            <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider block">Batting</span>
            <div class="grid grid-cols-4 gap-2 text-center text-xs">
              <div>
                <span class="text-slate-500 text-[10px] block">Runs</span>
                <strong class="text-white font-mono" x-text="p.stats ? p.stats.batting.runs : 0"></strong>
              </div>
              <div>
                <span class="text-slate-500 text-[10px] block">Highest</span>
                <strong class="text-white font-mono" x-text="p.stats ? p.stats.batting.highest_score : 0"></strong>
              </div>
              <div>
                <span class="text-slate-500 text-[10px] block">4s / 6s</span>
                <span class="text-slate-300 font-mono text-[11px]" x-text="p.stats ? (p.stats.batting.fours + '/' + p.stats.batting.sixes) : '0/0'"></span>
              </div>
              <div>
                <span class="text-slate-500 text-[10px] block">SR</span>
                <strong class="text-emerald-400 font-mono" x-text="p.stats ? p.stats.batting.strike_rate : '0.0'"></strong>
              </div>
            </div>
          </div>

          <!-- Bowling Summary -->
          <div class="mt-2 bg-slate-950/70 rounded-lg p-3 border border-slate-800/80 space-y-1">
            <span class="text-[10px] font-bold text-blue-400 uppercase tracking-wider block">Bowling</span>
            <div class="grid grid-cols-3 gap-2 text-center text-xs">
              <div>
                <span class="text-slate-500 text-[10px] block">Overs</span>
                <strong class="text-white font-mono" x-text="p.stats ? p.stats.bowling.overs : '0.0'"></strong>
              </div>
              <div>
                <span class="text-slate-500 text-[10px] block">Wickets</span>
                <strong class="text-emerald-400 font-mono" x-text="p.stats ? p.stats.bowling.wickets : 0"></strong>
              </div>
              <div>
                <span class="text-slate-500 text-[10px] block">Econ</span>
                <strong class="text-slate-300 font-mono" x-text="p.stats ? p.stats.bowling.economy : '0.0'"></strong>
              </div>
            </div>
          </div>

          <!-- Card Footer Actions -->
          <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex items-center justify-between">
            <span class="text-[10px] text-slate-500 font-mono" x-text="'Player #' + p.id"></span>
            <button type="button" @click="deletePlayer(p.id, p.name)"
              class="px-2.5 py-1 rounded-lg bg-red-950/40 hover:bg-red-900/60 border border-red-800/40 text-red-400 hover:text-red-200 text-xs font-semibold flex items-center gap-1 transition-all">
              <span>🗑️ Delete</span>
            </button>
          </div>

        </div>
      </div>
    </template>
  </div>

  <div x-show="filteredPlayers.length === 0" class="text-center py-12 text-slate-500 text-xs">
    No players found matching your search.
  </div>

</div>

<script>
function playerDirectory() {
  return {
    players: [],
    search: '',

    async init() {
      try {
        const res = await fetch('/api/players');
        if (res.ok) {
          const rawPlayers = await res.json();
          // Fetch stats for each player
          this.players = await Promise.all(
            rawPlayers.map(async (p) => {
              try {
                const sRes = await fetch(`/api/players/${p.id}/stats`);
                const sData = sRes.ok ? await sRes.json() : null;
                return { ...p, stats: sData };
              } catch {
                return { ...p, stats: null };
              }
            })
          );
        }
      } catch (err) {
        console.error('Error loading player directory', err);
      }
    },

    get filteredPlayers() {
      if (!this.search.trim()) return this.players;
      const q = this.search.toLowerCase();
      return this.players.filter(p => p.name.toLowerCase().includes(q));
    },

    async deletePlayer(playerId, playerName) {
      if (!confirm(`Are you sure you want to delete '${playerName}' from the player directory?`)) {
        return;
      }
      try {
        let res = await fetch(`/api/players/${playerId}`, { method: 'DELETE' });
        if (res.status === 400) {
          const data = await res.json();
          if (confirm(`${data.detail}\nDo you want to FORCE delete this player and remove their delivery records?`)) {
            res = await fetch(`/api/players/${playerId}?force=true`, { method: 'DELETE' });
          } else {
            return;
          }
        }
        if (!res.ok) {
          const err = await res.json();
          alert(err.detail || 'Failed to delete player');
          return;
        }
        this.players = this.players.filter(p => p.id !== playerId);
        alert(`Player '${playerName}' deleted successfully`);
      } catch (err) {
        alert('Error deleting player: ' + err.message);
      }
    },

    async cleanupUnused() {
      if (!confirm('Clean up all players who have never bowled or batted in any match?')) {
        return;
      }
      try {
        const res = await fetch('/api/players/cleanup/unused', { method: 'DELETE' });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        alert(data.message);
        await this.init();
      } catch (err) {
        alert('Failed to clean up players: ' + err.message);
      }
    }
  }
}
</script>
{% endblock %}
