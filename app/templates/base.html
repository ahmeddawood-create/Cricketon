<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a" id="meta-theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}MyCricScorer - Street & Weekend Cricket{% endblock %}</title>

  <!-- Theme Preload (Anti-FOUC) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('cricscorer_theme') || localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          const meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', '#f8fafc');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
          const meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', '#0f172a');
        }
      } catch (e) {}
    })();
  </script>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/static/manifest.json">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cricket: {
              pitch: '#15803d',
              accent: '#38bdf8',
              gold: '#eab308',
              danger: '#ef4444',
            }
          }
        }
      }
    }
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- html2canvas for WhatsApp Card Export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-white pb-safe">
  
  <!-- Navigation Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-bold text-lg tracking-tight text-white hover:text-emerald-400 transition-colors">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-emerald-900/30">
          🏏
        </div>
        <span>MyCric<span class="text-emerald-400">Scorer</span></span>
      </a>

      <div class="flex items-center gap-3">
        <a href="/" class="text-xs font-semibold px-2.5 py-1.5 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all">
          Matches
        </a>
        <a href="/players" class="text-xs font-semibold px-2.5 py-1.5 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all">
          Players
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-6">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Register PWA service worker if supported
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/js/sw.js').catch(console.error);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
